model_id: mlp-r4-h64-int8
family: mlp
input_rep: r4
config: h64
precision: int8
hyperparameters:
  hidden:
  - 64
training:
  optimizer: adam
  lr: 0.001
  batch: 64
  max_epochs: 100
  early_stopping:
    monitor: val_loss
    patience: 10
    restore_best: true
quantization:
  type: full-int8
  representative_windows: 500
seeds:
- 0
- 1
- 2
- 3
- 4
deployed_instance:
  protocol: P2
  fold: 0
  seed: 0
